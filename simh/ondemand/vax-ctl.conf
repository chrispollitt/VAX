# /etc/vax-ctl.conf: settings for vax-ctl (KEY=value; see vax-ctl for what each does).
# Installed once by install.sh; your edits are kept.

# Switch the VAX off after this many minutes with no activity.
IDLE_MINUTES=30

# "No activity" = simh used less than CPU_PCT_MAX percent of one core AND fewer than NET_BYTES_PER_MIN_MAX
# bytes a minute crossed the vaxtap interface.  Watch a quiet, logged-in VAX with `vax-ctl status` and
# `sudo journalctl -u vax-idle` and adjust if it never goes idle (or goes idle under a job).
CPU_PCT_MAX=3
NET_BYTES_PER_MIN_MAX=60000

# Nothing counts as idle for this long after the VAX starts: booting is quiet in places.
STARTUP_GRACE_MINUTES=10

# The command typed at VMS to shut it down: cpvax's own SHUTDOWN, which asks one question ("Do you really want to
# shutdown node CPVAX [NO]?", answered YES) and uses its defaults for the rest.  On a VMS without such a command use
# @SYS$SYSTEM:SHUTDOWN, which asks many more (vax-ctl answers those too, and any it does not know, with their defaults).
SHUTDOWN_COMMAND=SHUTDOWN

# For the long @SYS$SYSTEM:SHUTDOWN only: VMS warns logged-in users this many minutes before it shuts down.
SHUTDOWN_WARN_MINUTES=2

# After a failed orderly shutdown the VAX is left running; try again after this many minutes.
SHUTDOWN_RETRY_MINUTES=15

# Where OpenVMS answers telnet, and the systemd unit and tap interface of the simulator.
VMS_HOST=192.168.20.30
VMS_PORT=23
UNIT=vax.service
NET_IF=vaxtap

# The KA655 ROM self-test (about 50 s after the VAX starts) sometimes fails at random: `?53 ... Normal operation
# not possible.`, and the VAX sits at the >>> prompt.  vax-boot-watch reads the console at about 58 s and, if it
# failed, restarts the VAX: at most this many times in a row (then it leaves the VAX at >>> and logs it).
# 0 turns the restarting off (it still logs the verdict).
BOOT_RETRIES=3

# The simh console, which vax-boot-watch reads (SET CONSOLE TELNET= in vax.ini).
CONSOLE_HOST=127.0.0.1
CONSOLE_PORT=2323
