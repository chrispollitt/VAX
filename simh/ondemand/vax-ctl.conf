# /etc/vax-ctl.conf: settings for vax-ctl (KEY=value; see vax-ctl for what each does).
# Installed once by install.sh; your edits are kept.

# Switch the VAX off after this many minutes with no activity.
IDLE_MINUTES=30

# "No activity" = simh used less than CPU_PCT_MAX percent of one core AND fewer than NET_BYTES_PER_MIN_MAX
# bytes a minute crossed the vaxtap interface.  Watch a quiet, logged-in VAX with `vax-ctl status` and
# `sudo journalctl -u vax-idle` and adjust if it never goes idle (or goes idle under a job).
CPU_PCT_MAX=3
NET_BYTES_PER_MIN_MAX=60000

# Nothing counts as idle for this long after the VAX starts: booting is quiet in places.
STARTUP_GRACE_MINUTES=10

# VMS warns logged-in users this many minutes before it shuts down.
SHUTDOWN_WARN_MINUTES=2

# After a failed orderly shutdown the VAX is left running; try again after this many minutes.
SHUTDOWN_RETRY_MINUTES=15

# Where OpenVMS answers telnet, and the systemd unit and tap interface of the simulator.
VMS_HOST=192.168.20.30
VMS_PORT=23
UNIT=vax.service
NET_IF=vaxtap
